name: Generare APK PAD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Instaleaza Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instaleaza Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Dezarhiveaza proiectul
        run: unzip -o PAD_Android_Project.zip

      - name: Genereaza APK
        run: gradle -p PAD_Android_Project :app:assembleDebug --no-daemon

      - name: Salveaza APK
        uses: actions/upload-artifact@v4
        with:
          name: PAD-Proces-Verbal-APK
          path: PAD_Android_Project/app/build/outputs/apk/debug/app-debug.apk
